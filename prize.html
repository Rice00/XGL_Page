<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=992, height=1843, initial-scale=1.0">
  <title>随机抽奖</title>
  <link rel="preload" as="image" href="_3prizeBG.png">
  <link rel="preload" as="image" href="_2prizeBG.png">
  <link rel="preload" as="image" href="_1prizeBG.png">
  <link rel="preload" as="image" href="prizeBtn.png">
  <style>
    :root {
      --design-w: 992;
      --design-h: 1843;
      /* prizeref.png 布局比例 (992×1843) */
      --prize-zone-top: 26%;
      --prize-zone-bottom: 30%;
      --prize-btn-width: 420px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050a14;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .viewport {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .stage {
      width: calc(var(--design-w) * 1px);
      height: calc(var(--design-h) * 1px);
      position: relative;
      transform-origin: center center;
      flex-shrink: 0;
      background: #0a1628;
    }

    .view {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .view.active {
      visibility: visible;
      pointer-events: auto;
      z-index: 1;
    }

    /* ===== 页面1：设置 ===== */
    .view-settings {
      background: linear-gradient(180deg, #0b1a33 0%, #060d18 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 60px;
    }

    .settings-title {
      font-size: 48px;
      font-weight: 700;
      color: #f59e0b;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }

    .settings-subtitle {
      font-size: 22px;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 64px;
    }

    .settings-card {
      width: 100%;
      max-width: 640px;
      padding: 48px 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(96, 165, 250, 0.25);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    .settings-row label {
      width: 120px;
      font-size: 24px;
      color: #fff;
      flex-shrink: 0;
    }

    .settings-row input {
      flex: 1;
      height: 56px;
      border-radius: 12px;
      border: 1px solid rgba(96, 165, 250, 0.4);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 24px;
      padding: 0 16px;
      outline: none;
    }

    .settings-row input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
    }

    .settings-hint {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .confirm-btn {
      width: 100%;
      height: 64px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
      color: #fff;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(37, 99, 235, 0.4);
    }

    .confirm-btn:active {
      transform: scale(0.98);
    }

    .key-hint {
      margin-top: 48px;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.35);
      text-align: center;
      line-height: 1.8;
    }

    /* ===== 抽奖页 ===== */
    .view-prize {
      background-color: #0a1628;
      background-position: center top;
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }

    .prize-numbers {
      position: absolute;
      left: 6%;
      right: 6%;
      top: var(--prize-zone-top);
      bottom: var(--prize-zone-bottom);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
    }

    .prize-number {
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.55);
      text-align: center;
      line-height: 1.1;
      transition: opacity 0.2s, transform 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .prize-number.is-hidden {
      visibility: hidden;
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
      flex: none;
    }

    .prize-number.is-rolling,
    .prize-number.is-fixed {
      visibility: visible;
      position: relative;
      flex: 0 0 auto;
      width: 100%;
    }

    .prize-number.is-fixed {
      color: #fff;
      transform: scale(1.06);
    }

    .view-prize-5 .prize-number { font-size: 79px; }

    .view-prize-3 .prize-number { font-size: 118px; }

    .view-prize-1 .prize-number { font-size: 176px; }

    .prize-btn-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: var(--prize-btn-width);
    }

    .prize-btn-wrap.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .prize-btn {
      width: 100%;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .prize-btn img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }

    .prize-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage" id="stage">
      <!-- 页面1：设置 -->
      <section class="view view-settings active" id="viewSettings" data-page="0">
        <h1 class="settings-title">随机抽奖</h1>
        <p class="settings-subtitle">配置号码范围后开始抽奖</p>
        <div class="settings-card">
          <div class="settings-row">
            <label for="inputMin">下限</label>
            <input id="inputMin" type="number" value="1" min="1">
          </div>
          <div class="settings-row">
            <label for="inputMax">上限</label>
            <input id="inputMax" type="number" value="500" min="1">
          </div>
          <p class="settings-hint">范围包含上下限。三等奖 5 个、二等奖 3 个、一等奖 1 个，共 9 个号码且不重复。</p>
          <button class="confirm-btn" id="confirmBtn" type="button">确认</button>
        </div>
        <p class="key-hint">Z / ← 上一页　X / → 下一页<br>设置页 / 抽奖页：空格 = 确认 / 开奖 / 定格</p>
      </section>

      <!-- 页面2：三等奖 -->
      <section class="view view-prize view-prize-5" id="viewPrize3" data-page="1" data-count="5" style="background-image: url('_3prizeBG.png');">
        <div class="prize-numbers" id="numbers3"></div>
        <div class="prize-btn-wrap">
          <button class="prize-btn" type="button" data-prize="3" aria-label="开奖">
            <img src="prizeBtn.png" alt="开奖">
          </button>
        </div>
      </section>

      <!-- 页面3：二等奖 -->
      <section class="view view-prize view-prize-3" id="viewPrize2" data-page="2" data-count="3" style="background-image: url('_2prizeBG.png');">
        <div class="prize-numbers" id="numbers2"></div>
        <div class="prize-btn-wrap">
          <button class="prize-btn" type="button" data-prize="2" aria-label="开奖">
            <img src="prizeBtn.png" alt="开奖">
          </button>
        </div>
      </section>

      <!-- 页面4：一等奖 -->
      <section class="view view-prize view-prize-1" id="viewPrize1" data-page="3" data-count="1" style="background-image: url('_1prizeBG.png');">
        <div class="prize-numbers" id="numbers1"></div>
        <div class="prize-btn-wrap">
          <button class="prize-btn" type="button" data-prize="1" aria-label="开奖">
            <img src="prizeBtn.png" alt="开奖">
          </button>
        </div>
      </section>
    </div>
  </div>

  <script>
    // ===== 可配置常量 =====
    const DESIGN_W = 992;
    const DESIGN_H = 1843;
    const ROLL_INTERVAL = 45;
    const STAGGER_INTERVAL = 500; // 依次固定间隔（毫秒）
    const LAND_STEPS = 8;
    const LAND_INTERVAL = 55;

    const PAGE_IDS = ['viewSettings', 'viewPrize3', 'viewPrize2', 'viewPrize1'];
    const PRIZE_KEYS = ['3', '2', '1'];
    const PRELOAD_ASSETS = [
      '_3prizeBG.png',
      '_2prizeBG.png',
      '_1prizeBG.png',
      'prizeBtn.png',
    ];

    const stage = document.getElementById('stage');
    const inputMin = document.getElementById('inputMin');
    const inputMax = document.getElementById('inputMax');
    const confirmBtn = document.getElementById('confirmBtn');

    let currentPage = 0;
    let rangeMin = 1;
    let rangeMax = 500;
    let usedNumbers = new Set();

    const prizeStates = {
      '3': createPrizeState('numbers3', 5, '3'),
      '2': createPrizeState('numbers2', 3, '2'),
      '1': createPrizeState('numbers1', 1, '1'),
    };

    function createPrizeState(containerId, count, prizeKey) {
      const container = document.getElementById(containerId);
      const btnWrap = document.querySelector(`.prize-btn[data-prize="${prizeKey}"]`)?.closest('.prize-btn-wrap');
      const slots = [];

      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'prize-number is-hidden';
        el.textContent = '';
        container.appendChild(el);
        slots.push({
          el,
          value: null,
          fixed: false,
          timer: null,
          landTimer: null,
        });
      }

      return {
        containerId,
        count,
        btnWrap,
        slots,
        phase: 'idle', // idle | rolling | fixing | done
        fixTimers: [],
        picked: [],
      };
    }

    function setPrizeBtnVisible(state, visible) {
      if (state.btnWrap) {
        state.btnWrap.classList.toggle('is-hidden', !visible);
      }
    }

    function scaleStage() {
      const scale = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
      stage.style.transform = `scale(${scale})`;
    }

    function preloadAssets(urls) {
      return Promise.all(
        urls.map(
          (url) =>
            new Promise((resolve, reject) => {
              const img = new Image();
              img.onload = () => resolve(url);
              img.onerror = () => reject(new Error(`Failed to load ${url}`));
              img.src = url;
            })
        )
      );
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getAvailableNumbers() {
      const list = [];
      for (let i = rangeMin; i <= rangeMax; i++) {
        if (!usedNumbers.has(i)) list.push(i);
      }
      return list;
    }

    function pickUnique(count) {
      const available = getAvailableNumbers();
      if (available.length < count) {
        alert(`号码池不足：剩余 ${available.length} 个，需要 ${count} 个。请扩大范围或重置。`);
        return null;
      }

      for (let i = available.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [available[i], available[j]] = [available[j], available[i]];
      }

      return available.slice(0, count);
    }

    function showPage(index) {
      // 切页时隐藏非当前抽奖页的号码，避免数字残留
      PRIZE_KEYS.forEach((key, i) => {
        const prizePageIndex = i + 1;
        if (index === 0 || prizePageIndex !== index) {
          hidePrizeOnPageLeave(prizeStates[key]);
        }
      });

      PAGE_IDS.forEach((id, i) => {
        document.getElementById(id).classList.toggle('active', i === index);
      });

      if (index >= 1 && index <= 3) {
        showPrizeOnPageEnter(prizeStates[PRIZE_KEYS[index - 1]]);
      }

      currentPage = index;
    }

    function nextPage() {
      showPage((currentPage + 1) % PAGE_IDS.length);
    }

    function prevPage() {
      showPage((currentPage - 1 + PAGE_IDS.length) % PAGE_IDS.length);
    }

    function readRange() {
      const min = parseInt(inputMin.value, 10);
      const max = parseInt(inputMax.value, 10);

      if (Number.isNaN(min) || Number.isNaN(max)) {
        alert('请输入有效的数字范围');
        return false;
      }
      if (min > max) {
        alert('下限不能大于上限');
        return false;
      }
      if (max - min + 1 < 9) {
        alert('范围内至少需要有 9 个不重复号码（三等奖5 + 二等奖3 + 一等奖1）');
        return false;
      }

      rangeMin = min;
      rangeMax = max;
      return true;
    }

    function hidePrizeOnPageLeave(state) {
      clearPrizeTimers(state);

      if (state.phase === 'done') {
        // 已完成开奖：只隐藏号码，已占用的号码不回收到号码池
        state.slots.forEach((slot) => {
          slot.el.textContent = '';
          slot.el.className = 'prize-number is-hidden';
        });
        setPrizeBtnVisible(state, false);
        return;
      }

      resetPrizeState(state);
    }

    function showPrizeOnPageEnter(state) {
      if (state.phase !== 'done') return;

      state.slots.forEach((slot) => {
        slot.el.textContent = slot.value;
        slot.el.className = 'prize-number is-fixed';
      });
      setPrizeBtnVisible(state, false);
    }

    function resetPrizeState(state) {
      clearPrizeTimers(state);
      state.phase = 'idle';
      state.picked.forEach((n) => usedNumbers.delete(n));
      state.picked = [];
      state.slots.forEach((slot) => {
        slot.value = null;
        slot.fixed = false;
        slot.el.textContent = '';
        slot.el.className = 'prize-number is-hidden';
      });
      setPrizeBtnVisible(state, true);
    }

    function resetAllPrizes() {
      usedNumbers.clear();
      PRIZE_KEYS.forEach((key) => resetPrizeState(prizeStates[key]));
    }

    function clearPrizeTimers(state) {
      state.slots.forEach((slot) => {
        if (slot.timer) {
          clearInterval(slot.timer);
          slot.timer = null;
        }
        if (slot.landTimer) {
          clearInterval(slot.landTimer);
          slot.landTimer = null;
        }
      });
      state.fixTimers.forEach(clearTimeout);
      state.fixTimers = [];
    }

    function stopSlotRolling(slot) {
      if (slot.timer) {
        clearInterval(slot.timer);
        slot.timer = null;
      }
    }

    function landOnValue(slot, finalValue, onComplete) {
      stopSlotRolling(slot);
      if (slot.landTimer) {
        clearInterval(slot.landTimer);
        slot.landTimer = null;
      }

      let step = 0;
      slot.el.className = 'prize-number is-rolling';

      slot.landTimer = setInterval(() => {
        step++;
        if (step < LAND_STEPS - 1) {
          slot.el.textContent = randomInt(rangeMin, rangeMax);
          return;
        }

        clearInterval(slot.landTimer);
        slot.landTimer = null;
        slot.value = finalValue;
        slot.fixed = true;
        slot.el.textContent = finalValue;
        slot.el.className = 'prize-number is-fixed';
        onComplete?.();
      }, LAND_INTERVAL);
    }

    function startRolling(state) {
      state.phase = 'rolling';
      setPrizeBtnVisible(state, false);
      state.slots.forEach((slot) => {
        slot.fixed = false;
        slot.value = null;
        slot.el.className = 'prize-number is-rolling';
        slot.el.textContent = randomInt(rangeMin, rangeMax);
        slot.timer = setInterval(() => {
          slot.el.textContent = randomInt(rangeMin, rangeMax);
        }, ROLL_INTERVAL);
      });
    }

    function startFixing(state) {
      const picks = pickUnique(state.count);
      if (!picks) return;

      state.phase = 'fixing';
      state.picked = picks;
      picks.forEach((n) => usedNumbers.add(n));

      state.slots.forEach((slot, index) => {
        const timerId = setTimeout(() => {
          landOnValue(slot, picks[index], () => {
            if (index === state.slots.length - 1) {
              state.phase = 'done';
            }
          });
        }, index * STAGGER_INTERVAL);

        state.fixTimers.push(timerId);
      });
    }

    function handlePrizeAction(key) {
      const state = prizeStates[key];
      if (!state) return;

      if (state.phase === 'idle') {
        startRolling(state);
      } else if (state.phase === 'rolling') {
        startFixing(state);
      } else if (state.phase === 'done') {
        nextPage();
      }
    }

    function handleConfirm() {
      if (!readRange()) return;
      resetAllPrizes();
      showPage(1);
    }

    function isTypingTarget(el) {
      return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
    }

    confirmBtn.addEventListener('click', handleConfirm);

    document.querySelectorAll('.prize-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        handlePrizeAction(btn.dataset.prize);
      });
    });

    document.addEventListener('keydown', (e) => {
      if (isTypingTarget(document.activeElement)) return;

      const key = e.key.toLowerCase();

      if (key === 'z' || key === 'arrowleft') {
        e.preventDefault();
        prevPage();
        return;
      }

      if (key === 'x' || key === 'arrowright') {
        e.preventDefault();
        nextPage();
        return;
      }

      if (key === ' ') {
        e.preventDefault();
        if (currentPage === 0) {
          handleConfirm();
        } else if (currentPage >= 1 && currentPage <= 3) {
          handlePrizeAction(PRIZE_KEYS[currentPage - 1]);
        }
        return;
      }
    });

    preloadAssets(PRELOAD_ASSETS).catch(() => {});
    scaleStage();
    window.addEventListener('resize', scaleStage);
  </script>
</body>
</html>
