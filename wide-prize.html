<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=5386, height=1843, initial-scale=1.0">
  <title>随机抽奖（宽屏）</title>
  <link rel="preload" as="image" href="wide-prizeBG.png">
  <link rel="preload" as="image" href="prizeText-3.png">
  <link rel="preload" as="image" href="prizeText-2.png">
  <link rel="preload" as="image" href="prizeText-1.png">
  <link rel="preload" as="image" href="prizeBtn.png">
  <style>
    :root {
      --design-w: 5386;
      --design-h: 1843;
      --side-w: 992;
      /* 与 prize.html 竖屏区一致 */
      --prize-zone-top: 26%;
      --prize-zone-bottom: 30%;
      --prize-btn-width: 420px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050a14;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .viewport {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .stage {
      width: calc(var(--design-w) * 1px);
      height: calc(var(--design-h) * 1px);
      position: relative;
      transform-origin: center center;
      flex-shrink: 0;
      background: #0a1628;
    }

    /* 整屏通用背景（不随页面切换） */
    .stage-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .stage-bg img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
    }

    .side-panel {
      position: absolute;
      top: 0;
      width: calc(var(--side-w) * 1px);
      height: 100%;
      overflow: hidden;
      z-index: 2;
    }

    /* 竖屏文案图：多层常驻，切页只改 z-index */
    .side-text-stack {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .prize-text-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      visibility: hidden;
      opacity: 0;
    }

    .prize-text-layer.is-active {
      visibility: visible;
      opacity: 1;
      z-index: 1;
    }

    .prize-text-layer img {
      width: auto;
      height: auto;
      max-width: 100%;
      display: block;
      transform: translateY(170%);
    }

    .side-left { left: 0; }
    .side-right { right: 0; }

    .view {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .view.active {
      visibility: visible;
      pointer-events: auto;
      z-index: 2;
    }

    /* ===== 设置页 ===== */
    .view-settings {
      background: linear-gradient(180deg, rgba(11, 26, 51, 0.92) 0%, rgba(6, 13, 24, 0.92) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 60px;
    }

    .settings-title {
      font-size: 48px;
      font-weight: 700;
      color: #f59e0b;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }

    .settings-subtitle {
      font-size: 22px;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 64px;
    }

    .settings-card {
      width: 100%;
      max-width: 640px;
      padding: 48px 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(96, 165, 250, 0.25);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    .settings-row label {
      width: 120px;
      font-size: 24px;
      color: #fff;
      flex-shrink: 0;
    }

    .settings-row input {
      flex: 1;
      height: 56px;
      border-radius: 12px;
      border: 1px solid rgba(96, 165, 250, 0.4);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 24px;
      padding: 0 16px;
      outline: none;
    }

    .settings-row input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
    }

    .settings-section-label {
      font-size: 20px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 12px;
    }

    .settings-section-label + .settings-section-label {
      margin-top: 24px;
    }

    .settings-hint {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .confirm-btn {
      width: 100%;
      height: 64px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
      color: #fff;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(37, 99, 235, 0.4);
    }

    .confirm-btn:active {
      transform: scale(0.98);
    }

    .key-hint {
      margin-top: 48px;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.35);
      text-align: center;
      line-height: 1.8;
    }

    /* ===== 抽奖页（竖屏文案 prizeText-x + 号码/按钮叠在上层） ===== */
    .view-prize {
      background: transparent;
    }

    .prize-numbers {
      position: absolute;
      left: 6%;
      right: 6%;
      top: var(--prize-zone-top);
      bottom: var(--prize-zone-bottom);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
    }

    .prize-number {
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.55);
      text-align: center;
      line-height: 1.1;
      transition: opacity 0.2s, transform 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .prize-number.is-hidden {
      visibility: hidden;
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
      flex: none;
    }

    .prize-number.is-rolling,
    .prize-number.is-fixed {
      visibility: visible;
      position: relative;
      flex: 0 0 auto;
      width: 100%;
    }

    .prize-number.is-fixed {
      color: #fff;
      transform: scale(1.06);
    }

    .view-prize-5 .prize-number { font-size: 79px; }
    .view-prize-3 .prize-number { font-size: 118px; }
    .view-prize-1 .prize-number { font-size: 176px; }

    .prize-btn-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: var(--prize-btn-width);
    }

    .prize-btn-wrap.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .prize-btn {
      width: 100%;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .prize-btn img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }

    .prize-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage" id="stage">
      <div class="stage-bg">
        <img src="wide-prizeBG.png" alt="" decoding="async">
      </div>

      <!-- 左侧竖屏 992×1843 -->
      <div class="side-panel side-left" id="panelLeft">
        <div class="side-text-stack" aria-hidden="true">
          <div class="prize-text-layer" data-page="1">
            <img src="prizeText-3.png" alt="" decoding="async">
          </div>
          <div class="prize-text-layer" data-page="2">
            <img src="prizeText-2.png" alt="" decoding="async">
          </div>
          <div class="prize-text-layer" data-page="3">
            <img src="prizeText-1.png" alt="" decoding="async">
          </div>
        </div>
        <section class="view view-settings active" data-page="0">
          <h1 class="settings-title">随机抽奖</h1>
          <p class="settings-subtitle">配置号码范围后开始抽奖</p>
          <div class="settings-card">
            <p class="settings-section-label">区间 1</p>
            <div class="settings-row">
              <label for="inputMin1">下限</label>
              <input id="inputMin1" type="number" value="1" min="1" data-sync="min1">
            </div>
            <div class="settings-row">
              <label for="inputMax1">上限</label>
              <input id="inputMax1" type="number" value="200" min="1" data-sync="max1">
            </div>
            <p class="settings-section-label">区间 2</p>
            <div class="settings-row">
              <label for="inputMin2">下限</label>
              <input id="inputMin2" type="number" value="201" min="1" data-sync="min2">
            </div>
            <div class="settings-row">
              <label for="inputMax2">上限</label>
              <input id="inputMax2" type="number" value="600" min="1" data-sync="max2">
            </div>
            <p class="settings-hint">两个区间均为左右闭区间 [下限, 上限]。三等奖 5 个、二等奖 3 个、一等奖 1 个，共 9 个号码且不重复。</p>
            <button class="confirm-btn" type="button">确认</button>
          </div>
          <p class="key-hint">Z / ← 上一页　X / → 下一页<br>设置页：空格 = 确认　抽奖页：空格 = 开奖 / 定格</p>
        </section>

        <section class="view view-prize view-prize-5" data-page="1" data-count="5">
          <div class="prize-numbers" data-prize="3"></div>
          <div class="prize-btn-wrap">
            <button class="prize-btn" type="button" data-prize="3" aria-label="开奖">
              <img src="prizeBtn.png" alt="开奖">
            </button>
          </div>
        </section>

        <section class="view view-prize view-prize-3" data-page="2" data-count="3">
          <div class="prize-numbers" data-prize="2"></div>
          <div class="prize-btn-wrap">
            <button class="prize-btn" type="button" data-prize="2" aria-label="开奖">
              <img src="prizeBtn.png" alt="开奖">
            </button>
          </div>
        </section>

        <section class="view view-prize view-prize-1" data-page="3" data-count="1">
          <div class="prize-numbers" data-prize="1"></div>
          <div class="prize-btn-wrap">
            <button class="prize-btn" type="button" data-prize="1" aria-label="开奖">
              <img src="prizeBtn.png" alt="开奖">
            </button>
          </div>
        </section>
      </div>

      <!-- 右侧竖屏 992×1843 -->
      <div class="side-panel side-right" id="panelRight">
        <div class="side-text-stack" aria-hidden="true">
          <div class="prize-text-layer" data-page="1">
            <img src="prizeText-3.png" alt="" decoding="async">
          </div>
          <div class="prize-text-layer" data-page="2">
            <img src="prizeText-2.png" alt="" decoding="async">
          </div>
          <div class="prize-text-layer" data-page="3">
            <img src="prizeText-1.png" alt="" decoding="async">
          </div>
        </div>
        <section class="view view-settings active" data-page="0">
          <h1 class="settings-title">随机抽奖</h1>
          <p class="settings-subtitle">配置号码范围后开始抽奖</p>
          <div class="settings-card">
            <p class="settings-section-label">区间 1</p>
            <div class="settings-row">
              <label>下限</label>
              <input type="number" value="1" min="1" data-sync="min1">
            </div>
            <div class="settings-row">
              <label>上限</label>
              <input type="number" value="200" min="1" data-sync="max1">
            </div>
            <p class="settings-section-label">区间 2</p>
            <div class="settings-row">
              <label>下限</label>
              <input type="number" value="201" min="1" data-sync="min2">
            </div>
            <div class="settings-row">
              <label>上限</label>
              <input type="number" value="600" min="1" data-sync="max2">
            </div>
            <p class="settings-hint">两个区间均为左右闭区间 [下限, 上限]。三等奖 5 个、二等奖 3 个、一等奖 1 个，共 9 个号码且不重复。</p>
            <button class="confirm-btn" type="button">确认</button>
          </div>
          <p class="key-hint">Z / ← 上一页　X / → 下一页<br>设置页：空格 = 确认　抽奖页：空格 = 开奖 / 定格</p>
        </section>

        <section class="view view-prize view-prize-5" data-page="1" data-count="5">
          <div class="prize-numbers" data-prize="3"></div>
          <div class="prize-btn-wrap">
            <button class="prize-btn" type="button" data-prize="3" aria-label="开奖">
              <img src="prizeBtn.png" alt="开奖">
            </button>
          </div>
        </section>

        <section class="view view-prize view-prize-3" data-page="2" data-count="3">
          <div class="prize-numbers" data-prize="2"></div>
          <div class="prize-btn-wrap">
            <button class="prize-btn" type="button" data-prize="2" aria-label="开奖">
              <img src="prizeBtn.png" alt="开奖">
            </button>
          </div>
        </section>

        <section class="view view-prize view-prize-1" data-page="3" data-count="1">
          <div class="prize-numbers" data-prize="1"></div>
          <div class="prize-btn-wrap">
            <button class="prize-btn" type="button" data-prize="1" aria-label="开奖">
              <img src="prizeBtn.png" alt="开奖">
            </button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script>
    const DESIGN_W = 5386;
    const DESIGN_H = 1843;
    const ROLL_INTERVAL = 45;
    const STAGGER_INTERVAL = 500;
    const LAND_STEPS = 8;
    const LAND_INTERVAL = 55;
    const NUMBER_PAD = 3;

    const PRIZE_KEYS = ['3', '2', '1'];
    const PRELOAD_ASSETS = [
      'wide-prizeBG.png',
      'prizeText-3.png',
      'prizeText-2.png',
      'prizeText-1.png',
      'prizeBtn.png',
    ];

    const stage = document.getElementById('stage');
    const preloadedImages = new Map();
    const syncInputs = document.querySelectorAll('[data-sync]');

    let currentPage = 0;
    let ranges = [
      { min: 1, max: 200 },
      { min: 201, max: 600 },
    ];
    let usedNumbers = new Set();

    const prizeStates = {
      '3': createPrizeState('3', 5),
      '2': createPrizeState('2', 3),
      '1': createPrizeState('1', 1),
    };

    function createPrizeState(prizeKey, count) {
      const containers = document.querySelectorAll(`.prize-numbers[data-prize="${prizeKey}"]`);
      const btnWraps = document.querySelectorAll(`.prize-btn[data-prize="${prizeKey}"]`);
      const slots = [];

      for (let i = 0; i < count; i++) {
        const els = [];
        containers.forEach((container) => {
          const el = document.createElement('div');
          el.className = 'prize-number is-hidden';
          el.textContent = '';
          container.appendChild(el);
          els.push(el);
        });
        slots.push({
          els,
          value: null,
          fixed: false,
          timer: null,
          landTimer: null,
        });
      }

      return {
        count,
        btnWraps,
        slots,
        phase: 'idle',
        fixTimers: [],
        picked: [],
      };
    }

    function forEachSlotEl(slot, fn) {
      slot.els.forEach(fn);
    }

    function setSlotClass(slot, className) {
      forEachSlotEl(slot, (el) => { el.className = className; });
    }

    function formatPrizeNumber(n) {
      return String(n).padStart(NUMBER_PAD, '0');
    }

    function setSlotText(slot, text) {
      const display = text === '' || text === null || text === undefined
        ? ''
        : formatPrizeNumber(text);
      forEachSlotEl(slot, (el) => { el.textContent = display; });
    }

    function setPrizeBtnVisible(state, visible) {
      state.btnWraps.forEach((wrap) => {
        wrap.closest('.prize-btn-wrap')?.classList.toggle('is-hidden', !visible);
      });
    }

    function scaleStage() {
      const scale = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
      stage.style.transform = `scale(${scale})`;
    }

    function preloadAssets(urls) {
      return Promise.all(
        urls.map(
          (url) =>
            new Promise((resolve) => {
              const img = new Image();
              img.decoding = 'async';
              img.onload = () => {
                preloadedImages.set(url, img);
                resolve(url);
              };
              img.onerror = () => {
                console.warn('[wide-prize] 背景预加载失败:', url);
                resolve(url);
              };
              img.src = url;
            })
        )
      );
    }

    function applyPageVisuals(pageIndex) {
      document.querySelectorAll('.prize-text-layer').forEach((layer) => {
        const layerPage = parseInt(layer.dataset.page, 10);
        const isActive = layerPage === pageIndex;
        layer.classList.toggle('is-active', isActive);
      });
    }

    function warmPageImages() {
      stage.querySelectorAll('.stage-bg img, .prize-text-layer img').forEach((img) => {
        const url = img.getAttribute('src');
        if (url) preloadedImages.set(url, img);
        if (img.complete && img.decode) {
          img.decode().catch(() => {});
        }
      });
    }

    function buildPoolFromRanges(rangeList, excludeUsed = false) {
      const seen = new Set();
      const list = [];
      rangeList.forEach(({ min, max }) => {
        for (let i = min; i <= max; i++) {
          if (seen.has(i)) continue;
          if (excludeUsed && usedNumbers.has(i)) continue;
          seen.add(i);
          list.push(i);
        }
      });
      return list;
    }

    function randomFromRanges() {
      const pool = buildPoolFromRanges(ranges, false);
      if (!pool.length) return ranges[0].min;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function getAvailableNumbers() {
      return buildPoolFromRanges(ranges, true);
    }

    function pickUnique(count) {
      const available = getAvailableNumbers();
      if (available.length < count) {
        alert(`号码池不足：剩余 ${available.length} 个，需要 ${count} 个。请扩大范围或重置。`);
        return null;
      }

      for (let i = available.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [available[i], available[j]] = [available[j], available[i]];
      }

      return available.slice(0, count);
    }

    function showPage(index) {
      // 切页时隐藏非当前抽奖页的号码，避免数字残留
      PRIZE_KEYS.forEach((key, i) => {
        const prizePageIndex = i + 1;
        if (index === 0 || prizePageIndex !== index) {
          hidePrizeOnPageLeave(prizeStates[key]);
        }
      });

      document.querySelectorAll('.view[data-page]').forEach((view) => {
        view.classList.toggle('active', parseInt(view.dataset.page, 10) === index);
      });

      if (index >= 1 && index <= 3) {
        showPrizeOnPageEnter(prizeStates[PRIZE_KEYS[index - 1]]);
      }

      applyPageVisuals(index);
      currentPage = index;
    }

    function nextPage() {
      showPage((currentPage + 1) % 4);
    }

    function prevPage() {
      showPage((currentPage - 1 + 4) % 4);
    }

    function readRange() {
      const nextRanges = [
        {
          min: parseInt(document.querySelector('[data-sync="min1"]').value, 10),
          max: parseInt(document.querySelector('[data-sync="max1"]').value, 10),
        },
        {
          min: parseInt(document.querySelector('[data-sync="min2"]').value, 10),
          max: parseInt(document.querySelector('[data-sync="max2"]').value, 10),
        },
      ];

      if (nextRanges.some(({ min, max }) => Number.isNaN(min) || Number.isNaN(max))) {
        alert('请输入有效的数字范围');
        return false;
      }
      if (nextRanges.some(({ min, max }) => min > max)) {
        alert('每个区间的下限不能大于上限');
        return false;
      }

      const poolSize = buildPoolFromRanges(nextRanges, false).length;
      if (poolSize < 9) {
        alert(`两个区间合计至少需要有 9 个不重复号码（当前 ${poolSize} 个）`);
        return false;
      }

      ranges = nextRanges;
      return true;
    }

    function hidePrizeOnPageLeave(state) {
      clearPrizeTimers(state);

      if (state.phase === 'done') {
        // 已完成开奖：只隐藏号码，已占用的号码不回收到号码池
        state.slots.forEach((slot) => {
          setSlotText(slot, '');
          setSlotClass(slot, 'prize-number is-hidden');
        });
        setPrizeBtnVisible(state, false);
        return;
      }

      resetPrizeState(state);
    }

    function showPrizeOnPageEnter(state) {
      if (state.phase !== 'done') return;

      state.slots.forEach((slot) => {
        setSlotText(slot, slot.value);
        setSlotClass(slot, 'prize-number is-fixed');
      });
      setPrizeBtnVisible(state, false);
    }

    function resetPrizeState(state) {
      clearPrizeTimers(state);
      state.phase = 'idle';
      state.picked.forEach((n) => usedNumbers.delete(n));
      state.picked = [];
      state.slots.forEach((slot) => {
        slot.value = null;
        slot.fixed = false;
        setSlotText(slot, '');
        setSlotClass(slot, 'prize-number is-hidden');
      });
      setPrizeBtnVisible(state, true);
    }

    function resetAllPrizes() {
      usedNumbers.clear();
      PRIZE_KEYS.forEach((key) => resetPrizeState(prizeStates[key]));
    }

    function clearPrizeTimers(state) {
      state.slots.forEach((slot) => {
        if (slot.timer) {
          clearInterval(slot.timer);
          slot.timer = null;
        }
        if (slot.landTimer) {
          clearInterval(slot.landTimer);
          slot.landTimer = null;
        }
      });
      state.fixTimers.forEach(clearTimeout);
      state.fixTimers = [];
    }

    function stopSlotRolling(slot) {
      if (slot.timer) {
        clearInterval(slot.timer);
        slot.timer = null;
      }
    }

    function landOnValue(slot, finalValue, onComplete) {
      stopSlotRolling(slot);
      if (slot.landTimer) {
        clearInterval(slot.landTimer);
        slot.landTimer = null;
      }

      let step = 0;
      setSlotClass(slot, 'prize-number is-rolling');

      slot.landTimer = setInterval(() => {
        step++;
        if (step < LAND_STEPS - 1) {
          setSlotText(slot, randomFromRanges());
          return;
        }

        clearInterval(slot.landTimer);
        slot.landTimer = null;
        slot.value = finalValue;
        slot.fixed = true;
        setSlotText(slot, finalValue);
        setSlotClass(slot, 'prize-number is-fixed');
        onComplete?.();
      }, LAND_INTERVAL);
    }

    function startRolling(state) {
      state.phase = 'rolling';
      setPrizeBtnVisible(state, false);
      state.slots.forEach((slot) => {
        slot.fixed = false;
        slot.value = null;
        setSlotClass(slot, 'prize-number is-rolling');
        setSlotText(slot, randomFromRanges());
        slot.timer = setInterval(() => {
          setSlotText(slot, randomFromRanges());
        }, ROLL_INTERVAL);
      });
    }

    function startFixing(state) {
      const picks = pickUnique(state.count);
      if (!picks) return;

      state.phase = 'fixing';
      state.picked = picks;
      picks.forEach((n) => usedNumbers.add(n));

      state.slots.forEach((slot, index) => {
        const timerId = setTimeout(() => {
          landOnValue(slot, picks[index], () => {
            if (index === state.slots.length - 1) {
              state.phase = 'done';
            }
          });
        }, index * STAGGER_INTERVAL);

        state.fixTimers.push(timerId);
      });
    }

    function handlePrizeAction(key) {
      const state = prizeStates[key];
      if (!state) return;

      if (state.phase === 'idle') {
        startRolling(state);
      } else if (state.phase === 'rolling') {
        startFixing(state);
      }
    }

    function handleConfirm() {
      if (!readRange()) return;
      resetAllPrizes();
      showPage(1);
    }

    function isTypingTarget(el) {
      return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
    }

    // 左右竖屏输入框同步
    syncInputs.forEach((input) => {
      input.addEventListener('input', () => {
        const key = input.dataset.sync;
        const value = input.value;
        document.querySelectorAll(`[data-sync="${key}"]`).forEach((el) => {
          if (el !== input) el.value = value;
        });
      });
    });

    document.querySelectorAll('.confirm-btn').forEach((btn) => {
      btn.addEventListener('click', handleConfirm);
    });

    document.querySelectorAll('.prize-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        handlePrizeAction(btn.dataset.prize);
      });
    });

    document.addEventListener('keydown', (e) => {
      if (isTypingTarget(document.activeElement)) return;

      const key = e.key.toLowerCase();

      if (key === 'z' || key === 'arrowleft') {
        e.preventDefault();
        prevPage();
        return;
      }

      if (key === 'x' || key === 'arrowright') {
        e.preventDefault();
        nextPage();
        return;
      }

      if (key === ' ') {
        e.preventDefault();
        if (currentPage === 0) {
          handleConfirm();
        } else if (currentPage >= 1 && currentPage <= 3) {
          handlePrizeAction(PRIZE_KEYS[currentPage - 1]);
        }
      }
    });

    applyPageVisuals(0);
    preloadAssets(PRELOAD_ASSETS).then(() => {
      warmPageImages();
      applyPageVisuals(currentPage);
    });
    scaleStage();
    window.addEventListener('resize', scaleStage);
  </script>
</body>
</html>
