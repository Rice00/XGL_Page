<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a1628">
  <title>队伍助力</title>
  <script>
    if (/team_boost_success=1(?:;|$)/.test(document.cookie)) {
      document.documentElement.classList.add('already-boosted');
    }
  </script>
  <style>
    :root {
      --primary: #f59e0b;
      --primary-light: #fbbf24;
      --primary-bg: rgba(10, 22, 40, 0.55);
      --success: #10b981;
      --success-light: #34d399;
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.78);
      --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
      --radius: 16px;
      /* 按钮尺寸：略大于 ref 纯比例，适配实际视口 */
      --boost-size: clamp(168px, 38vw, 227px);
      --exit-width: clamp(168px, 48vw, 250px);
      --exit-aspect: 5;
      --exit-height: calc(var(--exit-width) / var(--exit-aspect));
      --bottom-offset: clamp(64px, 11vh, 104px);
      --actions-top: 62vh;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0a1628;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      color: var(--text);
    }

    .app {
      width: 100%;
      height: 100dvh;
      position: relative;
      overflow: hidden;
      background: url("bg.png") center top / auto 100% no-repeat;
      background-color: #0a1628;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(5, 15, 35, 0.08) 0%,
        rgba(5, 15, 35, 0.18) 55%,
        rgba(5, 15, 35, 0.45) 100%
      );
      pointer-events: none;
      z-index: 0;
    }

    .app::after {
      display: none;
    }

    .view {
      display: none;
      flex-direction: column;
      align-items: center;
      height: 100dvh;
      padding:
        calc(16px + env(safe-area-inset-top))
        20px
        env(safe-area-inset-bottom);
      position: relative;
      z-index: 1;
    }

    .view-success {
      padding-bottom: calc(var(--bottom-offset) + env(safe-area-inset-bottom));
    }

    .view.active {
      display: flex;
    }

    .view-body {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bottom-actions {
      flex-shrink: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(4px, 0.5vh, 8px);
    }

    .view-boost .bottom-actions {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--actions-top);
      margin-top: 0;
    }

    .view-success .bottom-actions {
      margin-top: auto;
    }

    html.already-boosted .view-boost {
      display: none !important;
    }

    html.already-boosted .view-success {
      display: flex !important;
    }

    /* 长按助力区域 */
    .boost-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
    }

    .boost-hint {
      margin-top: clamp(4px, 0.6vh, 8px);
      font-size: clamp(11px, 1.5vh, 13px);
      color: var(--text-secondary);
      letter-spacing: 0.05em;
    }

    .boost-ring-container {
      position: relative;
      width: var(--boost-size);
      height: var(--boost-size);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .boost-ring-container::before {
      content: "";
      position: absolute;
      width: 90%;
      height: 90%;
      border-radius: 50%;
      border: 2px solid rgba(245, 158, 11, 0.25);
      animation: pulse-ring 2s ease-in-out infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.06); opacity: 0.2; }
    }

    .boost-ring {
      position: absolute;
      inset: 5%;
      width: 90%;
      height: 90%;
      transform: rotate(-90deg);
    }

    .boost-ring circle {
      fill: none;
      stroke-width: 5;
    }

    .boost-ring .track {
      stroke: rgba(245, 158, 11, 0.2);
    }

    .boost-ring .progress {
      stroke: url(#progressGradient);
      stroke-dasharray: 565.48;
      stroke-dashoffset: 565.48;
      transition: stroke-dashoffset 0.05s linear;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.5));
    }

    .boost-btn {
      width: 72%;
      height: 72%;
      border-radius: 50%;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      padding: 0;
      z-index: 1;
      transition: transform 0.15s;
    }

    .boost-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .boost-btn:active,
    .boost-btn.pressing {
      transform: scale(0.94);
    }

    /* ===== 图2：成功页 ===== */
    .success-title {
      font-size: clamp(24px, 3.6vh, 28px);
      font-weight: 700;
      color: var(--text);
      margin-top: clamp(24px, 6vh, 60px);
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .success-icon-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: clamp(16px, 2.5vh, 24px);
      min-height: 0;
    }

    .success-subtitle {
      font-size: clamp(13px, 2vh, 15px);
      color: var(--text-secondary);
      letter-spacing: 0.06em;
    }

    /* 流行对勾动画 */
    .success-checkmark-wrap {
      width: clamp(96px, 16vh, 120px);
      height: clamp(96px, 16vh, 120px);
    }

    .success-checkmark {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
      stroke-width: 2;
      stroke: #fff;
      stroke-miterlimit: 10;
      box-shadow: inset 0 0 0 var(--success);
    }

    .checkmark-circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 2;
      stroke: var(--success);
      stroke-miterlimit: 10;
      fill: none;
    }

    .checkmark-check {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .success-checkmark-wrap.play .success-checkmark {
      animation: checkmark-fill 0.35s ease-in-out 0.45s forwards;
    }

    .success-checkmark-wrap.play .checkmark-circle {
      animation: checkmark-stroke 0.55s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }

    .success-checkmark-wrap.play .checkmark-check {
      animation: checkmark-stroke 0.25s cubic-bezier(0.65, 0, 0.45, 1) 0.65s forwards;
    }

    .success-checkmark-wrap.play {
      animation: checkmark-scale 0.25s ease-in-out 0.85s both;
    }

    @keyframes checkmark-stroke {
      100% { stroke-dashoffset: 0; }
    }

    @keyframes checkmark-scale {
      0%, 100% { transform: none; }
      50% { transform: scale(1.08); }
    }

    @keyframes checkmark-fill {
      100% { box-shadow: inset 0 0 0 60px var(--success); }
    }

    /* ===== 关闭按钮 ===== */
    .close-btn {
      width: var(--exit-width);
      height: auto;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      box-shadow: none;
      flex-shrink: 0;
    }

    .close-btn img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }

    .close-btn:active {
      transform: scale(0.97);
      opacity: 0.88;
    }

    .view-success .close-btn:active {
      opacity: 0.88;
    }

    /* 入场动画 */
    .view-success.active .success-title {
      animation: fadeInDown 0.5s ease both;
    }

    .view-success.active .success-subtitle {
      animation: fadeInUp 0.5s ease 0.9s both;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app">
    <!-- 图1：助力页 -->
    <div class="view view-boost active" id="viewBoost">
      <div class="bottom-actions">
        <div class="boost-area">
          <div class="boost-ring-container">
            <svg class="boost-ring" viewBox="0 0 200 200">
              <defs>
                <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#f59e0b" />
                  <stop offset="100%" stop-color="#fbbf24" />
                </linearGradient>
              </defs>
              <circle class="track" cx="100" cy="100" r="90" />
              <circle class="progress" id="progressRing" cx="100" cy="100" r="90" />
            </svg>
            <button class="boost-btn" id="boostBtn" aria-label="长按为他助力">
              <img src="btn.png" alt="助力">
            </button>
          </div>
          <p class="boost-hint">长按 2 秒完成助力</p>
        </div>

        <button class="close-btn" id="closeBtnBoost" aria-label="退出">
          <img src="exit.png" alt="退出">
        </button>
      </div>
    </div>

    <!-- 图2：成功页 -->
    <div class="view view-success" id="viewSuccess">
      <div class="view-body">
        <h1 class="success-title">助力成功</h1>

        <div class="success-icon-area">
          <div class="success-checkmark-wrap" id="successCheckmark">
            <svg class="success-checkmark" viewBox="0 0 52 52">
              <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none" />
              <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
            </svg>
          </div>
          <p class="success-subtitle">感谢你的支持</p>
        </div>
      </div>

      <div class="bottom-actions">
        <button class="close-btn" id="closeBtnSuccess" aria-label="退出">
          <img src="exit.png" alt="退出">
        </button>
      </div>
    </div>
  </div>

  <script>
    const viewBoost = document.getElementById('viewBoost');
    const viewSuccess = document.getElementById('viewSuccess');
    const boostBtn = document.getElementById('boostBtn');
    const progressRing = document.getElementById('progressRing');
    const closeBtnBoost = document.getElementById('closeBtnBoost');
    const closeBtnSuccess = document.getElementById('closeBtnSuccess');
    const successCheckmark = document.getElementById('successCheckmark');

    const CIRCUMFERENCE = 2 * Math.PI * 90; // 565.48
    const HOLD_DURATION = 2000; // 长按 2 秒完成助力
    const COOKIE_NAME = 'team_boost_success';
    const COOKIE_DAYS = 365;

    let pressStartTime = null;
    let rafId = null;
    let isPressing = false;

    function setCookie(name, value, days) {
      const expires = new Date();
      expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
      document.cookie = `${name}=${encodeURIComponent(value)};expires=${expires.toUTCString()};path=/;SameSite=Lax`;
    }

    function getCookie(name) {
      const match = document.cookie.match(
        new RegExp('(?:^|; )' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)')
      );
      return match ? decodeURIComponent(match[1]) : null;
    }

    function hasBoosted() {
      return getCookie(COOKIE_NAME) === '1';
    }

    function markBoosted() {
      setCookie(COOKIE_NAME, '1', COOKIE_DAYS);
      document.documentElement.classList.add('already-boosted');
    }

    function replayCheckAnimation() {
      if (!successCheckmark) return;
      successCheckmark.classList.remove('play');
      void successCheckmark.offsetWidth;
      successCheckmark.classList.add('play');
    }

    function initView() {
      if (hasBoosted()) {
        viewBoost.classList.remove('active');
        viewSuccess.classList.add('active');
        replayCheckAnimation();
      }
    }

    initView();

    progressRing.style.strokeDasharray = CIRCUMFERENCE;
    progressRing.style.strokeDashoffset = CIRCUMFERENCE;

    function setProgress(ratio) {
      const offset = CIRCUMFERENCE * (1 - Math.min(ratio, 1));
      progressRing.style.strokeDashoffset = offset;
    }

    function resetProgress() {
      setProgress(0);
      boostBtn.classList.remove('pressing');
    }

    function showSuccess() {
      markBoosted();
      viewBoost.classList.remove('active');
      viewSuccess.classList.add('active');
      resetProgress();
      replayCheckAnimation();
    }

    function updateProgress() {
      if (!isPressing) return;
      const elapsed = Date.now() - pressStartTime;
      const ratio = elapsed / HOLD_DURATION;
      setProgress(ratio);

      if (ratio >= 1) {
        stopPress();
        showSuccess();
        return;
      }
      rafId = requestAnimationFrame(updateProgress);
    }

    function startPress() {
      if (isPressing) return;
      isPressing = true;
      pressStartTime = Date.now();
      boostBtn.classList.add('pressing');
      rafId = requestAnimationFrame(updateProgress);
    }

    function stopPress() {
      isPressing = false;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      if (!viewSuccess.classList.contains('active')) {
        resetProgress();
      }
    }

    // 鼠标事件
    boostBtn.addEventListener('mousedown', startPress);
    boostBtn.addEventListener('mouseup', stopPress);
    boostBtn.addEventListener('mouseleave', stopPress);

    // 触摸事件
    boostBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startPress();
    }, { passive: false });

    boostBtn.addEventListener('touchend', stopPress);
    boostBtn.addEventListener('touchcancel', stopPress);

    // 关闭按钮
    function closePage() {
      window.open('', '_self');
      window.close();
    }

    closeBtnBoost.addEventListener('click', closePage);
    closeBtnSuccess.addEventListener('click', closePage);

    // bg.png 高度对齐 100dvh，文案底边在图片中的比例（可微调）
    const BG_TEXT_BOTTOM_RATIO = 0.602;
    const BOOST_GAP_RATIO = 0.006;

    function syncBoostActionsPosition() {
      const vh = window.innerHeight;
      const actionsTop = vh * (BG_TEXT_BOTTOM_RATIO + BOOST_GAP_RATIO);
      document.documentElement.style.setProperty('--actions-top', `${actionsTop}px`);
    }

    syncBoostActionsPosition();
    window.addEventListener('load', syncBoostActionsPosition);
    window.addEventListener('resize', syncBoostActionsPosition);

    // ========== DEV ONLY START — 正式版删除此整块 ==========
    (function initDevClearBoost() {
      const bottomActions = viewSuccess.querySelector('.bottom-actions');
      if (!bottomActions) return;

      const style = document.createElement('style');
      style.textContent = `
        .dev-clear-boost-btn {
          width: var(--exit-width);
          height: 38px;
          border: 1px dashed #e07a7a;
          background: rgba(255, 245, 245, 0.92);
          border-radius: 20px;
          font-size: 14px;
          color: #c0392b;
          cursor: pointer;
        }
        .dev-clear-boost-btn:active {
          background: #ffe8e8;
        }
      `;
      document.head.appendChild(style);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dev-clear-boost-btn';
      btn.textContent = '清除助力状态（测试）';
      bottomActions.insertBefore(btn, closeBtnSuccess);

      btn.addEventListener('click', () => {
        document.cookie = `${COOKIE_NAME}=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;SameSite=Lax`;
        document.documentElement.classList.remove('already-boosted');
        viewSuccess.classList.remove('active');
        viewBoost.classList.add('active');
        successCheckmark.classList.remove('play');
        resetProgress();
      });
    })();
    // ========== DEV ONLY END ==========
  </script>
</body>
</html>
